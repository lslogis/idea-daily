<h2>Pidgeon — AI 에이전트 전용 이메일</h2>
<p>사람 대신 AI 에이전트에게 메일함을 주는 서비스. 에이전트가 메일을 읽고 답장하는 전용 인박스다.</p>
<p>Show HN 신규. &#x27;에이전트에게도 메일 주소가 필요하다&#x27;는 전제 자체가 화제다.</p>
